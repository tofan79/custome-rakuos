# Intentionally a no-op. Left in the tree as documentation of the finding, but
# the directive itself is commented out because "blacklist wl" is only correct
# on hardware without Broadcom wireless, and this image ships to any machine.
#
# What the concern was: this base image pulls broadcom-wl kmod, which is an
# out-of-tree module and taints the kernel for nothing on non-Broadcom machines.
#
# Why it is not safe to enable by default: wl declares a vendor-wildcard alias,
#
#     alias pci:v*d*sv*sd*bc02sc80i* wl
#
# so udev/modprobe will offer it for *any* Network Controller (class 0x0280),
# not just Broadcom. On a laptop that actually needs it -- ThinkPad, older
# MacBooks, Dell with Broadcom -- enabling this kills wireless entirely and the
# user has no way to log in over wifi to fix it.
#
# On this particular machine (ASUS TUF A15 FA506ICB) it would have been fine:
# wifi is MediaTek MT7921 on mt7921e and LAN is Realtek r8169, no Broadcom at
# all. Confirmed with lspci -nnk. wl was never loaded -- the running kernel is
# tainted 4160, OUT_OF_TREE|LEAK_TRACEPOINTS, with no P or G flag from it.
#
# To opt in on a machine that needs the block:
#
#     uncomment the line below
#
# For an image meant to be general-purpose, leaving it commented is the only
# safe default: a wrongly-blacklisted driver is a hard boot problem, while a
# loaded-but-unused one is a cosmetic one.

#blacklist wl
