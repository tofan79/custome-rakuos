[Settings]
# adw-gtk3-dark: matches Noctalia [theme] mode = "dark". Written here so the
# skel and the running session agree; Noctalia also sets this via gsettings on
# every appearance sync, and gsettings is what actually wins.
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Colloid-Dark
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-cursor-theme-size=24
gtk-toolbar-style=GTK_TOOLBAR_ICONS
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR
gtk-button-images=0
gtk-menu-images=0
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb