[Settings]
gtk-theme-name=OrigamiPaper
# Colloid-Dark, not Colloid-Dracula: the Dracula name symlinks almost entirely to
# Colloid-Dracula-Light, which put light icons under a dark GTK theme. This is
# also the exact value Noctalia writes to dconf, so the skel and the running
# session agree and non-GTK consumers (qt6ct, kdeglobals) never disagree with
# what GTK apps show.
gtk-icon-theme-name=Colloid-Dark
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=1