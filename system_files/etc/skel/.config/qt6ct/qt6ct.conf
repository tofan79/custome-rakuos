[Appearance]
color_scheme_path = /home/$USER/.config/qt6ct/colors/noctalia.conf
custom_palette = true
# Matches the GTK icon theme; see gtk-3.0/settings.ini. Keeping these in step is the
# whole point, since qt6ct is not one of the consumers Noctalia rewrites.
icon_theme = Colloid-Dark
standard_dialogs = gtk3
style = Fusion
