## Cursor theme for the login screen.
##
## greetd 0.10.3 has no environment field in config.toml -- the only keys it
## accepts are command, user and terminal (verified against the binary's own
## error strings). So the cursor cannot be set from /etc/greetd/config.toml and
## has to be injected through the unit instead: greetd execs the session command
## as the `greeter` user with this environment, and noctalia-greeter-session
## passes it on to the bundled wlroots compositor, which reads XCURSOR_THEME.
##
## This is greeter-only and does not affect desktop sessions. Those get the same
## theme from ~/.config/uwsm/env (XCURSOR_THEME / XCURSOR_SIZE) plus the
## org.gnome.desktop.interface cursor keys set by dotfiles-setup.sh. Without
## this the login screen shows the default cursor, which looks inconsistent next
## to the desktop it hands off to.
##
## libXcursor is already in the base image (it owns /usr/lib64/libXcursor.so.1),
## so wlr_cursor_load() can read the .cur/.xcur files under
## /usr/share/icons/Bibata-Modern-Ice/. No extra package is needed.
[Service]
Environment=XCURSOR_THEME=Bibata-Modern-Ice
Environment=XCURSOR_SIZE=24