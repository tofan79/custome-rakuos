name: Build RakuOS Hyprland Image

on:
  workflow_dispatch:
    inputs:
      base_image_tag:
        description: 'Base image tag (staging, latest)'
        required: false
        default: 'staging'
      rakuos_staging:
        description: 'Enable staging (1 or 0)'
        required: false
        default: '1'

  schedule:
    - cron: '0 17 */3 * *'

env:
  REGISTRY: quay.io
  IMAGE_NAME: quay.io/mindset404/hyprland-nvidia-v3

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USER }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Resolve base image digest
        id: base_digest
        env:
          BASE_IMAGE_TAG: ${{ github.event.inputs.base_image_tag || 'staging' }}
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            "quay.io/rakuos/rakuos-base-nvidia-v3:${BASE_IMAGE_TAG}" \
            --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Base image: quay.io/rakuos/rakuos-base-nvidia-v3:${BASE_IMAGE_TAG}"
          echo "Base digest: ${DIGEST}"

      - name: Resolve Fedora version
        id: fedora_version
        env:
          BASE_IMAGE_TAG: ${{ github.event.inputs.base_image_tag || 'staging' }}
        run: |
          # rakuos-software reads org.rakuos.fedora.version to notice a Fedora
          # version change across an image update and offer a soft reset. Prefer
          # the value the base image declares so ours can never disagree with
          # what the Software Center sees. Bases built before 2026-09-29 do not
          # carry the label yet, so fall back to the tag mapping and it retires
          # itself once every base publishes the label.
          REF="quay.io/rakuos/rakuos-base-nvidia-v3:${BASE_IMAGE_TAG}"
          VERSION=$(docker buildx imagetools inspect "$REF" \
            --format '{{ index .Image "Labels" "org.rakuos.fedora.version" }}' 2>/dev/null || true)

          if [ -z "$VERSION" ] || [ "$VERSION" = "<no value>" ]; then
            case "${BASE_IMAGE_TAG}" in
              rawide|rawhide) VERSION="rawhide" ;;
              *)              VERSION="44" ;;
            esac
            echo "Base does not publish org.rakuos.fedora.version; using ${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Fedora version: ${VERSION}"

      - name: Build image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --pull \
            -f Containerfile \
            --build-arg BASE_IMAGE_TAG=${{ github.event.inputs.base_image_tag || 'staging' }} \
            --build-arg RAKUOS_STAGING=${{ github.event.inputs.rakuos_staging || '1' }} \
            --build-arg BUILD_DATE=$(date -u +%Y%m%d%H%M%S) \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label 'org.opencontainers.image.source=https://github.com/${{ github.repository }}' \
            --label 'org.opencontainers.image.revision=${{ github.sha }}' \
            --label "org.rakuos.base-digest=${{ steps.base_digest.outputs.digest }}" \
            --label "org.rakuos.fedora.version=${{ steps.fedora_version.outputs.version }}" \
            --label 'org.opencontainers.image.vendor=RakuOS' \
            --label 'org.opencontainers.image.description=RakuOS Hyprland' \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:$(date -u +%Y%m%d) \
            --push \
            .

      - name: Image digest
        run: |
          BASE_IMAGE_TAG="${{ github.event.inputs.base_image_tag || 'staging' }}"
          BASE_DIGEST="${{ steps.base_digest.outputs.digest }}"
          echo "Built ${{ env.IMAGE_NAME }}:latest"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Build info
          - Image: \`quay.io/mindset404/hyprland-nvidia-v3:latest\`
          - Base (\`staging\`): \`$BASE_DIGEST\`
          - Revision: \`${{ github.sha }}\`
          EOF

      - name: Cleanup old Quay tags
        env:
          QUAY_USER: ${{ secrets.QUAY_ROBOT_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
          KEEP_COUNT: 5
        run: |
          REPO="mindset404/hyprland-nvidia-v3"
          echo "Fetching tags on quay.io/$REPO..."
          TAGS=$(curl -sS -u "$QUAY_USER:$QUAY_TOKEN" \
            "https://quay.io/api/v1/repository/$REPO/tag/?onlyActiveTags=true&limit=100" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print("\n".join(t["name"] for t in d.get("tags",[])))')
          echo "All tags:"
          echo "$TAGS"
          # Only consider date tags we manage (e.g. 20260908); never touch latest
          DATE_TAGS=$(echo "$TAGS" | grep -E '^[0-9]{8}$' | sort -r)
          COUNT=$(echo "$DATE_TAGS" | grep -c . || true)
          echo "Date tags found: $COUNT"
          if [ "$COUNT" -le "$KEEP_COUNT" ]; then
            echo "Date tags ($COUNT) <= keep count ($KEEP_COUNT), skipping cleanup"
            exit 0
          fi
          echo "Keeping latest $KEEP_COUNT date tags, deleting older ones..."
          echo "$DATE_TAGS" | tail -n +$((KEEP_COUNT + 1)) | while read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Deleting tag $TAG..."
            curl -sS -X DELETE -u "$QUAY_USER:$QUAY_TOKEN" \
              "https://quay.io/api/v1/repository/$REPO/tag/$TAG" -o /dev/null || true
          done
          echo "Cleanup complete"